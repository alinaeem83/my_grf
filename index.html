<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRMG - GRF REPORT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    body{font-family:Arial,sans-serif;background:skyblue;margin:0;padding:0}
    .container{max-width:800px;margin:20px auto;padding:20px;background:#fff;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
    h1{text-align:center;color:blue;font-size:24px;margin-bottom:20px}
    h2{text-align:center;font-size:18px;text-decoration:underline;color:blue;margin-top:30px}
    label{font-weight:bold;display:block;margin:15px 0 5px}
    input,select,button{box-sizing:border-box;width:100%;padding:8px;margin-bottom:15px;border:1px solid #ccc;border-radius:5px}
    table{width:100%;margin-top:15px;border-collapse:collapse}
    th,td{padding:10px;border:1px solid #ccc;text-align:center}
    th{background:#f4f4f4}
    .situational-awareness{text-align:center;font-weight:bold;text-decoration:underline;color:blue;margin:20px 0}
    .grf-code{text-align:center;font-weight:bold;margin-top:20px;padding:10px;background:#f4f4f9;border:1px solid #ccc;border-radius:5px;overflow-wrap:anywhere}
    .submit-btn{background:blue;color:white;font-weight:bold;cursor:pointer}
    .submit-btn:hover{background:darkblue}
    @media(max-width:600px){.container{margin:10px;padding:12px}th,td{padding:5px;font-size:12px}}
</style>
</head>
<body>
<div class="container">
    <h1>GRF REPORT</h1>
    <form id="grfForm" onsubmit="validateAndSubmit(event)">
        <label>Reporter: <span style="color:red;">*</span></label>
        <input type="text" id="reporter" placeholder="Enter Reporter Name" required>

        <label>Aerodrome Name:</label>
        <input type="text" id="aerodromeName" value="VRMG" readonly>

        <label>Date (MMDD):</label>
        <input type="text" id="date" readonly>

        <label>Time (UTC):</label>
        <input type="text" id="time" readonly>

        <label>Lower Runway Designator (LRD):</label>
        <input type="text" id="lowerRunway" value="10" readonly>

        <h2>Runway Condition Details</h2>
        <table>
            <thead><tr><th></th><th>1st Third</th><th>2nd Third</th><th>3rd Third</th></tr></thead>
            <tbody>
                <tr><td>Runway Condition Code</td>
                    <td><select id="rwyCode1" required><option>5</option><option>2</option><option>3</option><option>4</option><option>6</option></select></td>
                    <td><select id="rwyCode2" required><option>5</option><option>2</option><option>3</option><option>4</option><option>6</option></select></td>
                    <td><select id="rwyCode3" required><option>5</option><option>2</option><option>3</option><option>4</option><option>6</option></select></td>
                </tr>
                <tr><td>% Coverage</td>
                    <td><select id="coverage1" required><option>100</option><option>75</option><option>50</option><option>25</option><option>NR</option></select></td>
                    <td><select id="coverage2" required><option>100</option><option>75</option><option>50</option><option>25</option><option>NR</option></select></td>
                    <td><select id="coverage3" required><option>100</option><option>75</option><option>50</option><option>25</option><option>NR</option></select></td>
                </tr>
                <tr><td>Depth</td>
                    <td><select id="depth1" required><option>NR</option><option>3mm</option><option>4mm</option></select></td>
                    <td><select id="depth2" required><option>NR</option><option>3mm</option><option>4mm</option></select></td>
                    <td><select id="depth3" required><option>NR</option><option>3mm</option><option>4mm</option></select></td>
                </tr>
                <tr><td>Runway Condition Descriptor</td>
                    <td><select id="descriptor1" required><option>WET</option><option>Dry</option><option>Slippery Wet</option><option>Standing Water</option></select></td>
                    <td><select id="descriptor2" required><option>WET</option><option>Dry</option><option>Slippery Wet</option><option>Standing Water</option></select></td>
                    <td><select id="descriptor3" required><option>WET</option><option>Dry</option><option>Slippery Wet</option><option>Standing Water</option></select></td>
                </tr>
            </tbody>
        </table>

        <div class="situational-awareness">Situational Awareness</div>
        <label>Taxiway:</label><input type="text" id="taxiway" value="GOOD" required>
        <label>Apron:</label><input type="text" id="apron" value="GOOD" required>
        <label>Turnpad 10:</label><input type="text" id="turnpad10" value="GOOD" required>
        <label>Turnpad 28:</label><input type="text" id="turnpad28" value="GOOD" required>
        <label>Others:</label><input type="text" id="others" value="GOOD" required>

        <div class="grf-code" id="grfCode">GRF Code will appear here...</div>
        <button type="submit" class="submit-btn">Submit &amp; Download PDF</button>
    </form>
</div>

function getCurrentUTC() {
    const now = new Date();
    return now.getUTCHours().toString().padStart(2,'0') +
           now.getUTCMinutes().toString().padStart(2,'0');
}
function getCurrentUTCDateMMDD() {
    const now = new Date();
    return (now.getUTCMonth()+1).toString().padStart(2,'0') +
           now.getUTCDate().toString().padStart(2,'0');
}
function updateGRFCode() {
    const aerodrome = document.getElementById("aerodromeName").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const lrd = document.getElementById("lowerRunway").value;
    const codes = [1,2,3].map(i => document.getElementById("rwyCode"+i).value);
    const coverage = [1,2,3].map(i => document.getElementById("coverage"+i).value);
    const depth = [1,2,3].map(i => document.getElementById("depth"+i).value);
    const descriptor = [1,2,3].map(i => document.getElementById("descriptor"+i).value);
    const grfCode = `${aerodrome} ${date} ${time} ${lrd} ${codes.join("/")} ${coverage.join("/")} ${depth.join("/")} ${descriptor.join("/")}`;
    document.getElementById("grfCode").innerText = grfCode;
}
function populateDateTime() {
    document.getElementById("date").value = getCurrentUTCDateMMDD();
    document.getElementById("time").value = getCurrentUTC();
}
function getRWYCCStyle(code) {
    const styles = {
        "6":{bg:[31,145,85],text:[255,255,255],label:"GOOD"},
        "5":{bg:[35,135,160],text:[255,255,255],label:"GOOD"},
        "4":{bg:[174,190,55],text:[20,35,20],label:"MEDIUM"},
        "3":{bg:[245,190,45],text:[35,35,35],label:"MEDIUM"},
        "2":{bg:[230,125,45],text:[255,255,255],label:"POOR"},
        "1":{bg:[200,55,55],text:[255,255,255],label:"POOR"},
        "0":{bg:[110,25,35],text:[255,255,255],label:"LESS THAN POOR"}
    };
    return styles[String(code)] || styles["4"];
}
function drawSectionTitle(doc,title,y) {
    doc.setFillColor(20,95,150);
    doc.roundedRect(13,y,184,8,1.5,1.5,"F");
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold");
    doc.setFontSize(9);
    doc.text(title,18,y+5.5);
}
function drawInfoCard(doc,x,y,w,label,value) {
    doc.setFillColor(246,248,251);
    doc.roundedRect(x,y,w,16,1.5,1.5,"F");
    doc.setTextColor(100,110,120);
    doc.setFont("helvetica","bold");
    doc.setFontSize(8);
    doc.text(label.toUpperCase(),x+4,y+5.5);
    doc.setTextColor(25,42,60);
    doc.setFontSize(10.5);
    const lines = doc.splitTextToSize(String(value || "-"),w-8);
    doc.text(lines.slice(0,1),x+4,y+12);
}
function drawCompactRunwayCard(doc,x,y,title,code,coverage,depth,descriptor) {
    const w=57, h=54, style=getRWYCCStyle(code);
    doc.setFillColor(247,249,252);
    doc.setDrawColor(215,225,235);
    doc.roundedRect(x,y,w,h,2,2,"FD");

    doc.setFont("helvetica","bold");
    doc.setFontSize(8);
    doc.setTextColor(30,55,80);
    doc.text(title,x+w/2,y+7,{align:"center"});

    doc.setFillColor(...style.bg);
    doc.roundedRect(x+19,y+10,19,19,2,2,"F");
    doc.setFontSize(16);
    doc.setTextColor(...style.text);
    doc.text(String(code),x+28.5,y+23,{align:"center"});

    doc.setFontSize(6);
    doc.text(style.label,x+w/2,y+33,{align:"center"});

    doc.setFont("helvetica","normal");
    doc.setFontSize(8);
    doc.setTextColor(65,75,85);
    doc.text("Coverage:",x+4,y+40);
    doc.setFont("helvetica","bold");
    doc.text(String(coverage)+(coverage==="NR"?"":"%"),x+w-4,y+40,{align:"right"});

    doc.setFont("helvetica","normal");
    doc.setFontSize(8);
    doc.text("Depth:",x+4,y+46);
    doc.setFont("helvetica","bold");
    doc.text(String(depth),x+w-4,y+46,{align:"right"});

    doc.setFont("helvetica","normal");
    doc.setFontSize(7.5);
    doc.setTextColor(75,85,95);
    doc.text(doc.splitTextToSize(String(descriptor||"-"),w-8).slice(0,1),x+4,y+52);
}
function drawSituationCard(doc,x,y,w,title,value,color) {
    doc.setFillColor(246,248,251);
    doc.roundedRect(x,y,w,15,1.5,1.5,"F");
    doc.setFillColor(...color);
    doc.rect(x,y,2,15,"F");
    doc.setFont("helvetica","bold");
    doc.setFontSize(8);
    doc.setTextColor(90,100,110);
    doc.text(title.toUpperCase(),x+5,y+5);
    doc.setFontSize(10.5);
    doc.setTextColor(25,65,90);
    const lines=doc.splitTextToSize(String(value||"-"),w-10);
    doc.text(lines.slice(0,1),x+5,y+11.5);
}

async function validateAndSubmit(event) {
    event.preventDefault();
    const inputs=document.querySelectorAll("input[required],select[required]");
    for(const input of inputs) {
        if(!input.value) {
            alert("Please fill out all required fields.");
            input.focus();
            return;
        }
    }
    if(!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF library could not be loaded. Check your internet connection.");
        return;
    }

    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const get=id=>document.getElementById(id).value;

    const reporter=get("reporter"), aerodrome=get("aerodromeName");
    const date=get("date"), time=get("time"), lrd=get("lowerRunway");
    const codes=[1,2,3].map(i=>get("rwyCode"+i));
    const coverages=[1,2,3].map(i=>get("coverage"+i));
    const depths=[1,2,3].map(i=>get("depth"+i));
    const descriptors=[1,2,3].map(i=>get("descriptor"+i));

    updateGRFCode();
    const grfCode=document.getElementById("grfCode").innerText;

    doc.setProperties({
        title:"VRMG GRF Runway Condition Report",
        subject:"Global Reporting Format",
        author:reporter,
        creator:"AddU International Airport - GRF System"
    });

    // Single A4 page
    doc.setFillColor(255,255,255);
    doc.rect(0,0,210,297,"F");

    // Embedded airport logo
    try {
        doc.addImage(AIRPORT_LOGO,"PNG",13,7,25,37);
    } catch(error) {
        console.warn("Could not place airport logo:",error);
    }

    // Header
    doc.setTextColor(12,36,66);
    doc.setFont("helvetica","bold");
    doc.setFontSize(16);
    doc.text("GLOBAL REPORTING FORMAT",43,18);
    doc.setFontSize(11);
    doc.setTextColor(20,115,175);
    doc.text("RUNWAY CONDITION REPORT",43,26);
    doc.setFont("helvetica","normal");
    doc.setFontSize(9.5);
    doc.setTextColor(90,100,110);
    doc.text("ADD U INTERNATIONAL AIRPORT",43,33);
    doc.text("AERODROME: VRMG",43,39);
    doc.setDrawColor(20,115,175);
    doc.setLineWidth(.8);
    doc.line(13,49,197,49);

    // Report information
    drawSectionTitle(doc,"REPORT INFORMATION",54);
    drawInfoCard(doc,13,67,88,"REPORTER",reporter);
    drawInfoCard(doc,109,67,88,"AERODROME",aerodrome);
    drawInfoCard(doc,13,87,55,"DATE (UTC)",date);
    drawInfoCard(doc,73,87,55,"TIME (UTC)",time);
    drawInfoCard(doc,133,87,64,"LOWER RWY DESIGNATOR",lrd);

    // Prominent centered GRF code panel
    doc.setFillColor(12,36,66);
    doc.roundedRect(13,108,184,34,3,3,"F");
    doc.setFont("helvetica","bold");
    doc.setFontSize(10);
    doc.setTextColor(110,200,255);
    doc.text("GENERATED GRF CODE",105,116,{align:"center"});
    doc.setFontSize(14);
    doc.setTextColor(255,255,255);
    const codeLines=doc.splitTextToSize(grfCode,170);
    doc.text(codeLines.slice(0,2),105,codeLines.length>1?124:130,{
        align:"center",lineHeightFactor:1.2
    });

    // Runway condition details
    drawSectionTitle(doc,"RUNWAY CONDITION DETAILS",148);
    doc.setFont("helvetica","bold");
    doc.setFontSize(8.5);
    doc.setTextColor(80,90,105);
    doc.text("RUNWAY 10",14,163);
    doc.text("RUNWAY 28",196,163,{align:"right"});
    doc.setFillColor(60,70,80);
    doc.roundedRect(13,165,184,4,1,1,"F");
    doc.setTextColor(255,255,255);
    doc.setFontSize(6);
    doc.text("1",43,168);
    doc.text("2",104,168);
    doc.text("3",165,168);

    drawCompactRunwayCard(doc,13,172,"1ST THIRD",codes[0],coverages[0],depths[0],descriptors[0]);
    drawCompactRunwayCard(doc,76.5,172,"2ND THIRD",codes[1],coverages[1],depths[1],descriptors[1]);
    drawCompactRunwayCard(doc,140,172,"3RD THIRD",codes[2],coverages[2],depths[2],descriptors[2]);

    // Situational awareness: five cards in two compact rows
    drawSectionTitle(doc,"SITUATIONAL AWARENESS",234);
    const situation=[
        ["TAXIWAY",get("taxiway")],
        ["APRON",get("apron")],
        ["TURNPAD 10",get("turnpad10")],
        ["TURNPAD 28",get("turnpad28")],
        ["OTHERS",get("others")]
    ];
    const colors=[
        [35,135,160],[31,145,85],[230,150,45],
        [110,100,180],[20,115,175]
    ];
    const positions=[
        [13,247],[76.5,247],[140,247],
        [44.5,266],[108,266]
    ];
    situation.forEach((item,i)=>{
        drawSituationCard(
            doc,positions[i][0],positions[i][1],57,
            item[0],item[1],colors[i]
        );
    });

    // Footer
    doc.setDrawColor(210,220,230);
    doc.setLineWidth(.3);
    doc.line(13,290,197,290);
    doc.setFont("helvetica","normal");
    doc.setFontSize(7);
    doc.setTextColor(110,120,130);
    doc.text("ADD U INTERNATIONAL AIRPORT | VRMG",13,294);
    doc.text("RUNWAY CONDITION REPORT",197,294,{align:"right"});

    const filename=`GRF_${aerodrome}_${date}_${time}.pdf`;
    doc.save(filename);
}

// Initialize form
document.addEventListener("DOMContentLoaded",()=>{
    populateDateTime();
    document.querySelectorAll("select,input").forEach(el=>{
        el.addEventListener("change",updateGRFCode);
        el.addEventListener("input",updateGRFCode);
    });
    updateGRFCode();
});
</script>
</body>
</html>
